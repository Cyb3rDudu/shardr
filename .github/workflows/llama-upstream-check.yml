# Workflow A — detect newer pinnable llama.cpp b-releases (>= 7 days
# soak time, complete prebuilt asset matrix) and open a lockfile update
# PR. Never merges, never releases. Bleeding-edge testing = workflow D.
name: llama upstream check

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      llama_ref:
        description: "Optional exact bNNNN release (>= 7 days old)"
        required: false

permissions:
  contents: write
  pull-requests: write
  actions: write # gh workflow run dispatch of the E2E matrix on the bot branch
  statuses: write # commit status 'llama build + E2E (bot dispatch)' on the bot commit

concurrency:
  group: llama-upstream-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # includes watching the dispatched E2E matrix (~20 min + macOS runner queue spikes)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod # pinned toolchain — moving "1.25" would break bundle idempotency

      - name: Verify current pin before any update decision
        # Fail loud BEFORE deciding: if upstream re-uploaded assets under
        # the SAME bNNNN (digests no longer match the pin), the run must
        # go red here — not silently continue as a no-op update check.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./cmd/llama-lock verify

      - name: Check upstream for a newer pinnable b-release
        id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=(check-update --write)
          if [ -n "${{ inputs.llama_ref }}" ]; then args+=(--ref "${{ inputs.llama_ref }}"); fi
          out=$(go run ./cmd/llama-lock "${args[@]}")
          echo "$out"
          case "$out" in
            noop*)  echo "decision=noop"  >> "$GITHUB_OUTPUT" ;;
            update*) echo "decision=update" >> "$GITHUB_OUTPUT"
                     echo "$out" | awk '{print "new_ref=" $3}' >> "$GITHUB_OUTPUT" ;;
            *) echo "unexpected output" >&2; exit 1 ;;
          esac

      - name: Open lockfile update PR
        id: pr
        if: steps.decide.outputs.decision == 'update'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          old_lock=$(git show HEAD:runtime/llama.lock)
          new_ref=$(go run ./cmd/llama-lock ref)
          new_commit=$(go run ./cmd/llama-lock validate | python3 -c 'import sys,json;print(json.load(sys.stdin)["commit"])')
          old_ref=$(printf '%s\n' "$old_lock" | sed -n 's/^ref = "\(.*\)"$/\1/p')
          old_commit=$(printf '%s\n' "$old_lock" | sed -n 's/^commit = "\(.*\)"$/\1/p')

          branch="bot/llama-${new_ref}"
          git config user.name "shardr-llama-bot"
          git config user.email "noreply@users.noreply.github.com"
          git checkout -B "$branch"
          git add runtime/llama.lock
          git commit -m "chore(llama): pin ${new_ref} (digest-pinned prebuilt runtime)"
          # Day-2 re-run: the bot branch may already exist upstream — fetch
          # it so --force-with-lease has remote-tracking info to check.
          git fetch origin "$branch" || true
          git push --force-with-lease origin "$branch"

          cat > /tmp/pr-body.md <<EOF
          Automated llama.cpp pin update (workflow A). No auto-merge.

          - old pin: \`${old_ref}\` (\`${old_commit}\`)
          - new pin: \`${new_ref}\` (\`${new_commit}\`) — upstream prebuilt
            release, at least 7 days old (community soak filter)
          - upstream compare: https://github.com/ggml-org/llama.cpp/compare/${old_commit}...${new_commit}
          - asset digests: pinned per platform in runtime/llama.lock
            (verified against the GitHub release API by \`llama-lock verify\`)
          - compatibility matrix: dispatched on this branch (\`llama build +
            E2E\`: Ubuntu x86-64, macOS Apple Silicon) — check its status
            before merging. Release happens only after merge (workflow C).
          EOF
          # One PR per target ref: reuse the existing one if present.
          if ! gh pr view "$branch" --json url >/dev/null 2>&1; then
            gh pr create --base main --head "$branch" \
              --title "chore(llama): pin ${new_ref}" \
              --body-file /tmp/pr-body.md
          else
            gh pr edit "$branch" --body-file /tmp/pr-body.md
            echo "existing PR for $branch updated"
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch E2E matrix on the bot branch
        # PRs opened with GITHUB_TOKEN do not fire pull_request events —
        # dispatch the matrix on the bot branch explicitly. The dispatched
        # run is CORRELATED, not guessed: new run id (not in the pre-dispatch
        # set), event workflow_dispatch, headSha == the bot commit just
        # pushed, created after the dispatch. Workflow A then watches the
        # run to completion and goes RED on failure/cancel — the link in
        # the PR body plus the commit status make the outcome visible
        # where a human merges.
        if: steps.decide.outputs.decision == 'update'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.pr.outputs.branch }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          # pre-dispatch watermark: GitHub databaseIds are monotonically
          # increasing, so the dispatched run is the FIRST workflow_dispatch
          # run on this branch, at this commit, with id > watermark.
          watermark=$(gh run list --workflow llama-build-e2e.yml --branch "$BRANCH" \
            --event workflow_dispatch --limit 1 --json databaseId \
            --jq 'map(.databaseId) | max // 0')
          gh workflow run llama-build-e2e.yml --ref "$BRANCH"

          run_id=""
          for _ in $(seq 1 18); do
            # --event: the bot PR also spawns an action_required
            # pull_request run (empty placeholder) — never link that one.
            # --commit: only runs for the bot commit just pushed.
            # 2>/dev/null + ||: a transient API error must not abort the
            # step mid-poll — the loop retries, E_DISPATCH catches the rest.
            run_id=$(gh run list --workflow llama-build-e2e.yml --branch "$BRANCH" \
              --event workflow_dispatch --commit "$HEAD_SHA" --limit 10 \
              --json databaseId --jq "map(select(.databaseId > ${watermark}) | .databaseId) | max // empty" 2>/dev/null) || run_id=""
            [ -n "$run_id" ] && break
            sleep 10
          done
          if [ -z "$run_id" ]; then
            echo "E_DISPATCH: no new E2E run for $BRANCH at commit $HEAD_SHA after dispatch" >&2
            exit 1
          fi

          # pending status BEFORE the ~20-min watch: the PR shows an
          # in-flight gate the whole time; the final post overwrites it
          # (pending -> success/failure is how the statuses API works).
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=pending -f context="llama build + E2E (bot dispatch)" \
            -f target_url="$run_url" -f description="dispatched E2E matrix (watching)"

          # real gate: watch to completion, red on failure OR cancellation.
          # --interval 30: the 3s default is ~400 API calls over 20 min —
          # rate-limiting the watcher would false-red a green run.
          # On non-zero exit the AUTHORITATIVE conclusion decides the posted
          # state — a watcher/API infra error must not post a false failure
          # for a green run — but the step still goes red unless the run
          # itself concluded success.
          watch_ok=false
          if gh run watch "$run_id" --exit-status --interval 30; then
            watch_ok=true
          fi
          conclusion=$(gh run view "$run_id" --json conclusion --jq .conclusion 2>/dev/null) || conclusion=""
          if [ "$watch_ok" = true ] && [ "$conclusion" = success ]; then
            state=success
          else
            state=failure
            echo "E_E2E: dispatched E2E run $run_id did not succeed (conclusion: ${conclusion:-unknown})" >&2
          fi

          gh pr edit "$BRANCH" --body "$(gh pr view "$BRANCH" --json body --jq .body)

          E2E matrix (dispatched on this branch, gated by workflow A): $run_url"
          # commit status on the bot commit: shows up as a check in the PR
          # (gates once branch protection requires this context)
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="$state" -f context="llama build + E2E (bot dispatch)" \
            -f target_url="$run_url" -f description="dispatched E2E matrix"
          echo "E2E run $run_id ($state): $run_url" >> "$GITHUB_STEP_SUMMARY"
          [ "$state" = success ]

      - name: No-op summary
        if: steps.decide.outputs.decision != 'update'
        run: echo "No newer pinnable b-release (>= 7 days soak) — no PR (noop run)." >> "$GITHUB_STEP_SUMMARY"
