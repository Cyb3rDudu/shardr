# Workflow D — weekly nightly canary. Tests the newest bNNNN upstream
# release through the SAME digest-verified fetch + E2E matrix, but NEVER
# touches runtime/llama.lock and NEVER creates a stable release. No age
# filter here: canary exists to catch breakage BEFORE the 7-day soak
# ends. Prerelease channel is a later step.
name: llama nightly canary

on:
  schedule:
    - cron: "37 4 * * 1"
  workflow_dispatch:
    inputs:
      llama_ref:
        description: "Exact bNNNN tag"
        required: false

permissions:
  contents: read

concurrency:
  group: llama-nightly-canary
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ref: ${{ steps.pick.outputs.ref }}
      commit: ${{ steps.pick.outputs.commit }}
      digests: ${{ steps.pick.outputs.digests }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
      - name: Pick nightly ref (explicit bNNNN or newest upstream)
        id: pick
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANARY_REF: ${{ inputs.llama_ref }}
        run: |
          if [ -n "$CANARY_REF" ]; then
            case "$CANARY_REF" in
              b[0-9]*) ;;
              *) echo "E_REF: canary input must be an exact bNNNN tag, got '$CANARY_REF'" >&2; exit 1 ;;
            esac
            json=$(go run ./cmd/llama-lock resolve "$CANARY_REF")
          else
            json=$(go run ./cmd/llama-lock latest-nightly)
          fi
          echo "$json"
          {
            echo "ref=$(printf '%s' "$json" | python3 -c 'import sys,json;print(json.load(sys.stdin)["ref"])')"
            echo "commit=$(printf '%s' "$json" | python3 -c 'import sys,json;print(json.load(sys.stdin)["commit"])')"
            echo "digests=$(printf '%s' "$json" | python3 -c 'import sys,json;print(json.dumps(json.load(sys.stdin)["asset_sha256"]))')"
          } >> "$GITHUB_OUTPUT"

  test:
    needs: resolve
    uses: ./.github/workflows/llama-build-e2e.yml
    with:
      llama_ref: ${{ needs.resolve.outputs.ref }}

  summary:
    needs: [resolve, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Canary summary
        run: |
          {
            echo "## llama nightly canary"
            echo "- ref: \`${{ needs.resolve.outputs.ref }}\`"
            echo "- commit: \`${{ needs.resolve.outputs.commit }}\`"
            echo "- asset digests: \`${{ needs.resolve.outputs.digests }}\`"
            echo "- matrix result: **${{ needs.test.result }}**"
            echo "- lockfile untouched: yes (canary never writes runtime/llama.lock)"
            echo "- stable release: none (canary channel only)"
          } >> "$GITHUB_STEP_SUMMARY"
