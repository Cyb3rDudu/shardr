# Workflow C — publish runner bundles from MERGED main only. The lockfile
# PR itself never releases. Idempotent: an existing release identity with
# identical bytes is a noop; with different bytes it hard-fails.
name: release runner

on:
  push:
    branches: [main]
    paths:
      - runtime/llama.lock
      - Makefile
      - cmd/**
      - internal/**
      - scripts/**
      - go.mod
      - go.sum
      - .github/workflows/release-runner.yml
      - .github/workflows/llama-build-e2e.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-runner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-e2e:
    uses: ./.github/workflows/llama-build-e2e.yml

  bundle:
    needs: build-and-e2e
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux_amd64
          - os: macos-latest
            platform: darwin_arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: runner-bin-${{ matrix.platform }}
          path: bindir
      - name: Build shardr binary (must match the tested commit)
        run: go build -o bindir/shardr ./cmd/shardr
      - name: Bundle
        run: bash scripts/make-runner-bundle.sh "${{ matrix.platform }}" bindir dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runner-dist-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  release:
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # release creation — build/test jobs never get this
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: runner-dist-*
          path: dist
          merge-multiple: true
      - name: Publish (idempotent, no overwrite)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-release.sh dist
