# Workflow C — publish runner bundles from MERGED main only. The lockfile
# PR itself never releases. Idempotent: an existing release identity with
# identical bytes is a noop; with different bytes it hard-fails.
# The llama runtime is the upstream PREBUILT binary set from the lockfile
# (never self-built); bundles ship the whole extract dir (dylibs are
# @loader_path-relative).
name: release runner

on:
  push:
    branches: [main]
    paths:
      - runtime/llama.lock
      - Makefile
      - cmd/**
      - internal/**
      - scripts/**
      - go.mod
      - go.sum
      - .github/workflows/release-runner.yml
      - .github/workflows/llama-build-e2e.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-runner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-e2e:
    # Release boundary: builds and publishing run on main ONLY. A manual
    # workflow_dispatch on any other branch must not produce releases.
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/llama-build-e2e.yml

  bundle:
    needs: build-and-e2e
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        platform: [darwin_arm64, linux_amd64]
    runs-on: ${{ matrix.platform == 'darwin_arm64' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: runner-bin-${{ matrix.platform }}
          path: dist
      - name: Bundle (reproducible)
        run: bash scripts/make-runner-bundle.sh "${{ matrix.platform }}" dist out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runner-dist-${{ matrix.platform }}
          path: out/
          if-no-files-found: error

  release:
    needs: bundle
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # release creation — build/test jobs never get this
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: runner-dist-*
          path: dist
          merge-multiple: true
      - name: Provenance proof (tag -> commit, API digests == pin)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./cmd/llama-lock verify
      - name: Publish (idempotent, no overwrite)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-release.sh dist
