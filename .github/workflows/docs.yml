# Build and deploy the shardr documentation site to GitHub Pages.
# Trigger: docs(...) commits (paths) on main. Uses the standard Pages
# actions pinned to full commit SHAs (repo convention). The MkDocs
# output dir is _site/ (not the default site/, which is a tracked product
# placeholder); see mkdocs.yml.
#
# Repo prerequisite: GitHub Settings → Pages → Build and deployment →
# Source = "GitHub Actions".
name: docs

on:
  push:
    branches:
      - main
    paths:
      - 'mkdocs.yml'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'mkdocs.yml'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install MkDocs
        run: pip install -r docs/requirements.txt

      - name: Generalizability gate (no private infra in published docs)
        # The published site must carry no host-specific values. docs/
        # is the whole MkDocs source dir (the internal _inventory.md holds
        # any explicit reference values and is exempt).
        run: |
          if grep -rniE '192\.168\.|mothership|\/Users\/|100\.(6[4-9]|7[0-9]|8[0-9]|9[0-9]|1[0-2][0-7])\.' docs/ | grep -v '_inventory.md'; then
            echo "private infra found in published docs"
            exit 1
          fi

      - name: Build documentation
        run: mkdocs build --clean --strict

      - name: Check relative links
        run: bash docs/check-links.sh

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./_site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
