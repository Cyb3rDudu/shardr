# Build and deploy the shardr documentation site to GitHub Pages.
# Trigger: docs(...) commits (paths) on main. Uses the standard Pages
# actions pinned to full commit SHAs (repo convention). The MkDocs
# output dir is _site/ (not the default site/, which is a tracked product
# placeholder); see mkdocs.yml.
#
# Repo prerequisite: GitHub Settings → Pages → Build and deployment →
# Source = "GitHub Actions".
name: docs

on:
  push:
    branches:
      - main
    paths:
      - 'mkdocs.yml'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'mkdocs.yml'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Least privilege at the workflow level: every job can read the repo. The
# deploy job opts into Pages publishing below; no other job gets those
# scopes.
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install MkDocs
        run: pip install -r docs/requirements.txt

      - name: Generalizability gate (no private infra in published docs)
        # Scope = the pages the site actually publishes, derived from
        # mkdocs.yml via docs/list-published.py (the same source as the link
        # checker). Canonical specs, the inventory, and the archived first-run
        # page are not published and do not trip this gate.
        run: |
          mapfile -t published < <(python3 docs/list-published.py)
          if grep -nHiE '192\.168\.|mothership|\/Users\/|100\.(6[4-9]|7[0-9]|8[0-9]|9[0-9]|1[0-2][0-7])\.' "${published[@]}"; then
            echo "private infra found in published docs"
            exit 1
          fi

      - name: Build documentation
        run: mkdocs build --clean --strict

      - name: Check relative links and anchors
        run: bash docs/check-links.sh

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./_site

  deploy:
    # Publishing is main-only. A workflow_dispatch on any ref still runs the
    # build (and can fail it), but only a main ref may overwrite the site.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
